dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-oauth2-client'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-websocket'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    api 'com.nimbusds:nimbus-jose-jwt:10.7'
    api 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    api "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    
    api "io.github.openfeign.querydsl:querydsl-jpa-spring:${querydslVersion}"
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'
}
