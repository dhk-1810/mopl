version: '3.8'

services:
  # -------------------------------------------------------------
  # Nginx Service
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: mopl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
      # 필요 시 SSL 인증서 디렉토리 마운트 (Let's Encrypt 등)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # Redis Services (각 마이크로서비스별 독립 인스턴스)
  # -------------------------------------------------------------
  user-redis:
    image: redis:7.2-alpine
    container_name: mopl-user-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_USER:-mopluserpwd123} --appendonly yes
    volumes:
      - user-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M # EC2 메모리 부하 방지를 위해 제한 설정 (조정 가능)

  content-redis:
    image: redis:7.2-alpine
    container_name: mopl-content-redis
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_CONTENT:-moplcontentpwd123} --appendonly yes
    volumes:
      - content-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  playlist-redis:
    image: redis:7.2-alpine
    container_name: mopl-playlist-redis
    ports:
      - "6381:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_PLAYLIST:-moplplaylistpwd123} --appendonly yes
    volumes:
      - playlist-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-redis:
    image: redis:7.2-alpine
    container_name: mopl-dm-redis
    ports:
      - "6382:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_DM:-mopldmpwd123} --appendonly yes
    volumes:
      - dm-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification-redis:
    image: redis:7.2-alpine
    container_name: mopl-notification-redis
    ports:
      - "6383:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --appendonly yes
    volumes:
      - notification-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  watching-session-redis:
    image: redis:7.2-alpine
    container_name: mopl-watching-session-redis
    ports:
      - "6384:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_WATCHING_SESSION:-moplwatchpwd123} --appendonly yes
    volumes:
      - watching-session-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # -------------------------------------------------------------
  # RabbitMQ Service
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mopl-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # -------------------------------------------------------------
  # Spring Boot Microservices
  # -------------------------------------------------------------
  mopl-user:
    build:
      context: ../mopl-user
      dockerfile: Dockerfile
    container_name: mopl-user-server
    ports:
      - "8081:8081"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - SPRING_DATA_REDIS_HOST=user-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - user-redis
      - rabbitmq
    restart: always

  mopl-content:
    build:
      context: ../mopl-content
      dockerfile: Dockerfile
    container_name: mopl-content-server
    ports:
      - "8082:8082"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8082
      - SPRING_DATA_REDIS_HOST=content-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - content-redis
      - rabbitmq
    restart: always

  mopl-playlist:
    build:
      context: ../mopl-playlist
      dockerfile: Dockerfile
    container_name: mopl-playlist-server
    ports:
      - "8083:8083"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8083
      - SPRING_DATA_REDIS_HOST=playlist-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - playlist-redis
      - rabbitmq
    restart: always

  mopl-dm:
    build:
      context: ../mopl-dm
      dockerfile: Dockerfile
    container_name: mopl-dm-server
    ports:
      - "8084:8084"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8084
      - SPRING_DATA_REDIS_HOST=dm-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - dm-redis
      - rabbitmq
    restart: always

  mopl-notification:
    build:
      context: ../mopl-notification
      dockerfile: Dockerfile
    container_name: mopl-notification-server
    ports:
      - "8085:8085"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8085
      - SPRING_DATA_REDIS_HOST=notification-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - notification-redis
      - rabbitmq
    restart: always

  mopl-watching-session:
    build:
      context: ../mopl-watching-session
      dockerfile: Dockerfile
    container_name: mopl-watching-session-server
    ports:
      - "8086:8086"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8086
      - SPRING_DATA_REDIS_HOST=watching-session-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - watching-session-redis
      - rabbitmq
    restart: always

  mopl-image:
    build:
      context: ../mopl-image
      dockerfile: Dockerfile
    container_name: mopl-image-server
    ports:
      - "8087:8087"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8087
      - SPRING_DATA_REDIS_HOST=user-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - user-redis
      - rabbitmq
    restart: always

  mopl-batch:
    build:
      context: ../mopl-batch
      dockerfile: Dockerfile
    container_name: mopl-batch-server
    ports:
      - "8088:8087"
    env_file:
      - ../.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8087
      - SPRING_DATA_REDIS_HOST=user-redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      - user-redis
      - rabbitmq
    restart: always

# 데이터 영속성을 위한 Docker 볼륨 설정
volumes:
  user-redis-data:
  content-redis-data:
  playlist-redis-data:
  dm-redis-data:
  notification-redis-data:
  watching-session-redis-data:
