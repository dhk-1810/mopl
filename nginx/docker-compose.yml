version: '3.8'

services:
  # -------------------------------------------------------------
  # Nginx Service (API Gateway / Reverse Proxy)
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: mopl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # Redis Services (각 마이크로서비스별 독립 인스턴스)
  # -------------------------------------------------------------
  user-redis:
    image: redis:7.2-alpine
    container_name: mopl-user-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_USER:-mopluserpwd123} --appendonly yes
    volumes:
      - user-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  content-redis:
    image: redis:7.2-alpine
    container_name: mopl-content-redis
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_CONTENT:-moplcontentpwd123} --appendonly yes
    volumes:
      - content-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  playlist-redis:
    image: redis:7.2-alpine
    container_name: mopl-playlist-redis
    ports:
      - "6381:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_PLAYLIST:-moplplaylistpwd123} --appendonly yes
    volumes:
      - playlist-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-redis:
    image: redis:7.2-alpine
    container_name: mopl-dm-redis
    ports:
      - "6382:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_DM:-mopldmpwd123} --appendonly yes
    volumes:
      - dm-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification-redis:
    image: redis:7.2-alpine
    container_name: mopl-notification-redis
    ports:
      - "6383:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --appendonly yes
    volumes:
      - notification-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  watching-session-redis:
    image: redis:7.2-alpine
    container_name: mopl-watching-session-redis
    ports:
      - "6384:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_WATCHING_SESSION:-moplwatchpwd123} --appendonly yes
    volumes:
      - watching-session-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # -------------------------------------------------------------
  # RabbitMQ Service
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mopl-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # -------------------------------------------------------------
  # PostgreSQL Databases (Database-per-service 격리)
  # -------------------------------------------------------------
  user-db:
    image: postgres:15-alpine
    container_name: mopl-user-db
    ports:
      - "5432:5432"
    env_file:
      - ../mopl-user/.env.local.user
    volumes:
      - user-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  content-db:
    image: postgres:15-alpine
    container_name: mopl-content-db
    ports:
      - "5433:5432"
    env_file:
      - ../mopl-content/.env.local.content
    volumes:
      - content-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  playlist-db:
    image: postgres:15-alpine
    container_name: mopl-playlist-db
    ports:
      - "5434:5432"
    env_file:
      - ../mopl-playlist/.env.local.playlist
    volumes:
      - playlist-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-db:
    image: postgres:15-alpine
    container_name: mopl-dm-db
    ports:
      - "5435:5432"
    env_file:
      - ../mopl-dm/.env.local.dm
    volumes:
      - dm-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification-db:
    image: postgres:15-alpine
    container_name: mopl-notification-db
    ports:
      - "5436:5432"
    env_file:
      - ../mopl-notification/.env.local.notification
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  image-db:
    image: postgres:15-alpine
    container_name: mopl-image-db
    ports:
      - "5438:5432"
    env_file:
      - ../mopl-image/.env.local.image
    volumes:
      - image-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  batch-db:
    image: postgres:15-alpine
    container_name: mopl-batch-db
    ports:
      - "5439:5432"
    env_file:
      - ../mopl-batch/.env.local.batch
    volumes:
      - batch-db-data:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

# 데이터 영속성을 위한 Docker 볼륨 설정
volumes:
  user-redis-data:
  content-redis-data:
  playlist-redis-data:
  dm-redis-data:
  notification-redis-data:
  watching-session-redis-data:
  user-db-data:
  content-db-data:
  playlist-db-data:
  dm-db-data:
  notification-db-data:
  image-db-data:
  batch-db-data:
