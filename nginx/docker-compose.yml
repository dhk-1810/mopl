version: '3.8'

services:
  # -------------------------------------------------------------
  # Nginx Service
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: mopl-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # 필요 시 SSL 인증서 디렉토리 마운트 (Let's Encrypt 등)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # Redis Services (각 마이크로서비스별 독립 인스턴스)
  # -------------------------------------------------------------
  user-redis:
    image: redis:7.2-alpine
    container_name: mopl-user-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_USER:-mopluserpwd123} --appendonly yes
    volumes:
      - user-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M # EC2 메모리 부하 방지를 위해 제한 설정 (조정 가능)

  content-redis:
    image: redis:7.2-alpine
    container_name: mopl-content-redis
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_CONTENT:-moplcontentpwd123} --appendonly yes
    volumes:
      - content-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  playlist-redis:
    image: redis:7.2-alpine
    container_name: mopl-playlist-redis
    ports:
      - "6381:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_PLAYLIST:-moplplaylistpwd123} --appendonly yes
    volumes:
      - playlist-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-redis:
    image: redis:7.2-alpine
    container_name: mopl-dm-redis
    ports:
      - "6382:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_DM:-mopldmpwd123} --appendonly yes
    volumes:
      - dm-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification-redis:
    image: redis:7.2-alpine
    container_name: mopl-notification-redis
    ports:
      - "6383:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --appendonly yes
    volumes:
      - notification-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  watching-session-redis:
    image: redis:7.2-alpine
    container_name: mopl-watching-session-redis
    ports:
      - "6384:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_WATCHING_SESSION:-moplwatchpwd123} --appendonly yes
    volumes:
      - watching-session-redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

# 데이터 영속성을 위한 Docker 볼륨 설정
volumes:
  user-redis-data:
  content-redis-data:
  playlist-redis-data:
  dm-redis-data:
  notification-redis-data:
  watching-session-redis-data:
