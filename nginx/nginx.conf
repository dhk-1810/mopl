events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ECS 서비스별 Upstream 정의
    # AWS Cloud Map(서비스 디스커버리) 또는 내부 ALB DNS 주소로 변경하여 사용하세요.

    upstream user_service {
        ip_hash; # 세션 유지를 위해 ip_hash 사용
        server host.docker.internal:8081;
    }

    upstream content_service {
        ip_hash;
        server host.docker.internal:8082;
    }

    upstream playlist_service {
        ip_hash;
        server host.docker.internal:8083;
    }

    upstream dm_service {
        ip_hash;
        server host.docker.internal:8084;
    }

    upstream notification_service {
        ip_hash;
        server host.docker.internal:8085;
    }

    upstream watching_session_service {
        ip_hash;
        server host.docker.internal:8086;
    }

    upstream image_service {
         ip_hash;
         server host.docker.internal:8087;
    }


    upstream batch_service {
        ip_hash;
        server host.docker.internal:8088;
    }

    server {
        listen 80;
        server_name localhost;

        # AWS VPC DNS IP (보통 VPC CIDR 대역의 2번째 IP입니다. 예: 10.0.0.2 또는 172.31.0.2)
        resolver 10.0.0.2 valid=5s;

        # 공통 프록시 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # -------------------------------------------------------------
        # 0. Nginx Auth Request (Token Validation Subrequest)
        # -------------------------------------------------------------
        location = /auth-validate {
            internal;
            proxy_pass http://user_service/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;

            set $auth_token $http_authorization;
            if ($auth_token = "") {
                set $auth_token "Bearer $arg_token";
            }
            proxy_set_header Authorization $auth_token;
        }

        # -------------------------------------------------------------
        # 1. Watching Session Service (Regex 매칭 우선 순위)
        # -------------------------------------------------------------
        # /api/users/{watcherId}/watching-sessions
        location ~ ^/api/users/[^/]+/watching-sessions {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            set $user_service_backend "http://host.docker.internal:8081";
            proxy_pass $user_service_backend;
            add_header X-Upstream-Server $upstream_addr;
        }

        # /api/contents/{contentId}/watching-sessions
        location ~ ^/api/contents/[^/]+/watching-sessions {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://watching_session_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        # -------------------------------------------------------------
        # 2. SSE (Server-Sent Events) - Notification Service
        # -------------------------------------------------------------
        location /api/sse {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # SSE 무중단 스트리밍을 위한 버퍼링 및 캐시 비활성화
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            
            # 타임아웃 1시간으로 연장
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header X-Upstream-Server $upstream_addr;
        }

        # -------------------------------------------------------------
        # 3. WebSocket - DM Service (STOMP /ws)
        # -------------------------------------------------------------
        location /ws {
            proxy_pass http://dm_service;
            proxy_http_version 1.1;
            
            # 프로토콜 업그레이드 헤더 설정
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 웹소켓 버퍼링 비활성화 및 타임아웃 연장
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -------------------------------------------------------------
        # 4. 각 Microservice API 라우팅 (Prefix 매칭)
        # -------------------------------------------------------------

        # User / Auth / Follow Service
        location /api/auth {
            proxy_pass http://user_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        location /api/users {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://user_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        location /api/follows {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://user_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        # Content / Review Service
        location /api/contents {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://content_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        location /api/reviews {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://content_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        # Playlist Service
        location /api/playlists {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://playlist_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        # DM Service (Conversations)
        location /api/conversations {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://dm_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        # Notification Service
        location /api/notifications {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://notification_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        # Batch Service
        location /api/admin/batch {
            auth_request /auth-validate;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-Id $user_id;

            proxy_pass http://batch_service;
            add_header X-Upstream-Server $upstream_addr;
        }

        # Frontend Static File Serving
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
