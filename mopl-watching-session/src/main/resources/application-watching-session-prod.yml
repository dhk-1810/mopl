spring:
  datasource:
    watching-session:
      url: jdbc:postgresql://${DB_ENDPOINT_WATCHING_SESSION:localhost}:5432/${DB_NAME_WATCHING_SESSION}
      username: ${DB_USERNAME_WATCHING_SESSION}
      password: ${DB_PASSWORD_WATCHING_SESSION}
      driver-class-name: org.postgresql.Driver
  jpa:
    watching-session:
      hibernate:
        ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: false
