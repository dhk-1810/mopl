services:
  mopl-live-chat-app:
    container_name: mopl-live-chat-app
    build:
      context: ..
      dockerfile: mopl-live-chat/Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - .env
    depends_on:
      - mopl-live-chat-redis
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mopl-live-chat-redis:
    image: redis:7.2-alpine
    container_name: mopl-live-chat-redis
    ports:
      - "6381:6379"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
