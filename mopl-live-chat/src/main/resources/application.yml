server:
  port: 8083

spring:
  application:
    name: mopl-live-chat
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      password: ${SPRING_DATA_REDIS_PASSWORD}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual


mopl:
  storage:
    aws:
      region: ${AWS_REGION:ap-northeast-2}
      bucket-name: ${AWS_S3_BUCKET}
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
      signature-duration-in-hours: 1 # Presigned URL 유효기간

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"

grpc:
  server:
    port: ${GRPC_SERVER_PORT:8184}
  client:
    user-service:
      address: "static://${GRPC_USER_HOST:localhost}:${GRPC_USER_PORT:8181}"
      negotiation-type: plaintext
    content-service:
      address: "static://${GRPC_CONTENT_HOST:localhost}:${GRPC_CONTENT_PORT:8182}"
      negotiation-type: plaintext
