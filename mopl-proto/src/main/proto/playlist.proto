syntax = "proto3";

package org.codeit.sb06.team03.mopl.grpc.playlist;

option java_multiple_files = true;
option java_package = "org.codeit.sb06.team03.mopl.grpc.playlist";
option java_outer_classname = "PlaylistProto";

service PlaylistService {
  rpc DeleteCurations (DeleteCurationsRequest) returns (DeleteCurationsResponse);
  rpc RestoreCurations (RestoreCurationsRequest) returns (RestoreCurationsResponse);
}

message DeleteCurationsRequest {
  string content_id = 1;
}

message DeleteCurationsResponse {
  bool success = 1;
  int32 deleted_count = 2;
}

message RestoreCurationsRequest {
  string content_id = 1;
}

message RestoreCurationsResponse {
  bool success = 1;
}
