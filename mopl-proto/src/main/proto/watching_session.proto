syntax = "proto3";

package org.codeit.sb06.team03.mopl.grpc.watchingsession;

option java_multiple_files = true;
option java_package = "org.codeit.sb06.team03.mopl.grpc.watchingsession";
option java_outer_classname = "WatchingSessionProto";

service WatchingSessionService {
  rpc DeleteWatchingSessions (DeleteWatchingSessionsRequest) returns (DeleteWatchingSessionsResponse);
}

message DeleteWatchingSessionsRequest {
  string content_id = 1;
}

message DeleteWatchingSessionsResponse {
  bool success = 1;
}
