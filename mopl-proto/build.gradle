plugins {
    // 순수 Java 라이브러리 모듈 선언 (다른 서비스 모듈에서 api/implementation으로 참조)
    id 'java-library'
    // Protobuf 컴파일 및 코드 생성을 위한 Gradle 플러그인
    id 'com.google.protobuf'
}

dependencies {
    // Protobuf 메시지와 gRPC를 연동하기 위한 필수 라이브러리 (api: 참조 모듈에도 전파)
    api "io.grpc:grpc-protobuf:${grpcVersion}"
    // gRPC 클라이언트 Stub 및 서버 ImplBase 클래스를 사용하기 위한 의존성
    api "io.grpc:grpc-stub:${grpcVersion}"
    // Protobuf Java 런타임 라이브러리
    api "com.google.protobuf:protobuf-java:${protobufVersion}"

    // gRPC 컴파일러가 생성한 코드의 @javax.annotation.Generated 어노테이션 호환을 위한 의존성
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    // Jakarta EE 호환성 유지를 위한 어노테이션 API
    compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
}

// Protobuf 및 gRPC 코드 생성기 설정 블록
protobuf {
    // .proto 파일을 Java 코드로 변환하는 Protoc 컴파일러 아티팩트 지정
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    // gRPC Java 코드(서비스 인터페이스, Stub) 생성을 위한 플러그인 지정
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    // 모든 proto 컴파일 태스크에 gRPC 플러그인을 활성화하여 빌드 시 gRPC Stub 생성
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
