# -------------------------------------------------------------
# 로컬 테스트만을 위한 DB, Redis, RabbitMQ 구성임.
# -------------------------------------------------------------
services:

  # -------------------------------------------------------------
  # Redis Services (각 마이크로서비스별 독립 인스턴스)
  # -------------------------------------------------------------
  user-redis:
    image: redis:7.2-alpine
    container_name: mopl-user-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_USER:-mopluserpwd123} --save "" --appendonly no
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  live-chat-redis:
    image: redis:7.2-alpine
    container_name: mopl-live-chat-redis
    ports:
      - "6380:6379"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification-redis-1:
    image: redis:7.2-alpine
    container_name: mopl-notification-redis-1
    ports:
      - "7001:7001"
      - "17001:17001"
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --masterauth ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification-redis-2:
    image: redis:7.2-alpine
    container_name: mopl-notification-redis-2
    ports:
      - "7002:7002"
      - "17002:17002"
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --masterauth ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  notification-redis-3:
    image: redis:7.2-alpine
    container_name: mopl-notification-redis-3
    ports:
      - "7003:7003"
      - "17003:17003"
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --masterauth ${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --cluster-announce-hostname localhost --cluster-preferred-endpoint-type hostname --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # 최초 1회 실행. 3개 노드를 하나의 클러스터로 묶고 16,384개 해시 슬롯을 나눠줌. (클러스터 활성화)
  notification-redis-cluster-init:
    image: redis:7.2-alpine
    container_name: mopl-notification-redis-cluster-init
    depends_on:
      - notification-redis-1
      - notification-redis-2
      - notification-redis-3
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for Redis cluster nodes to start...' &&
      sleep 3 &&
      redis-cli -a $${REDIS_PASSWORD_NOTIFICATION:-moplnotificationpwd123} --cluster create notification-redis-1:7001 notification-redis-2:7002 notification-redis-3:7003 --cluster-yes || true
      "


  # -------------------------------------------------------------
  # RabbitMQ Service
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mopl-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # -------------------------------------------------------------
  # Kafka & Debezium Connect (KRaft Mode for CDC & Event Streaming)
  # 'docker compose --profile kafka up -d' 로 구동 가능
  # -------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mopl-kafka
    profiles: ["kafka", "cdc"]
    ports:
      - "9092:9092"
      - "29092:29092"
      - "29094:29094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092,PLAINTEXT_DOCKER://host.docker.internal:29094'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092,PLAINTEXT_DOCKER://0.0.0.0:29094'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  kafka-connect:
    image: quay.io/debezium/connect:2.6
    container_name: mopl-kafka-connect
    profiles: ["kafka", "cdc"]
    ports:
      - "8089:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      ENABLE_DEBEZIUM_SCRIPTING: "false"
    depends_on:
      - kafka
      - content-db
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  # -------------------------------------------------------------
  # PostgreSQL Databases (Database-per-service 격리)
  # -------------------------------------------------------------
  user-db:
    image: postgres:18-alpine
    container_name: mopl-user-db
    ports:
      - "5432:5432"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    env_file:
      - mopl-user/.env.dev
    volumes:
      - user-db-data:/var/lib/postgresql
      - ./mopl-user/docker/postgres/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-slave-db:
    image: postgres:18-alpine
    container_name: mopl-user-slave-db
    ports:
      - "5431:5432"
    env_file:
      - mopl-user/.env.dev
    environment:
      - MASTER_HOST=user-db
    volumes:
      - user-slave-db-data:/var/lib/postgresql
      - ./mopl-user/docker/postgres/entrypoint-slave.sh:/entrypoint-slave.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-slave.sh"]
    depends_on:
      user-db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  content-db:
    image: postgres:18-alpine
    container_name: mopl-content-db
    command: ["postgres", "-p", "5433", "-c", "wal_level=logical"]
    ports:
      - "5433:5433"
    env_file:
      - mopl-content/.env.dev
    volumes:
      - content-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  playlist-db:
    image: postgres:18-alpine
    container_name: mopl-playlist-db
    command: postgres -p 5434
    ports:
      - "5434:5434"
    env_file:
      - mopl-playlist/.env.dev
    volumes:
      - playlist-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-db:
    image: postgres:18-alpine
    container_name: mopl-dm-db
    command: postgres -p 5435
    ports:
      - "5435:5435"
    env_file:
      - mopl-dm/.env.dev
    volumes:
      - dm-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-mongo:
    image: mongo:7.0
    container_name: mopl-dm-mongo
    ports:
      - "27017:27017"
    env_file:
      - mopl-dm/.env.dev
    volumes:
      - dm-mongo-data:/data/db
    restart: always

  notification-db:
    image: postgres:18-alpine
    container_name: mopl-notification-db
    command: postgres -p 5436
    ports:
      - "5436:5436"
    env_file:
      - mopl-notification/.env.dev
    volumes:
      - notification-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  image-db:
    image: postgres:18-alpine
    container_name: mopl-image-db
    command: postgres -p 5437
    ports:
      - "5437:5437"
    env_file:
      - mopl-image/.env.dev
    volumes:
      - image-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  batch-db:
    image: postgres:18-alpine
    container_name: mopl-batch-db
    command: postgres -p 5438
    ports:
      - "5438:5438"
    env_file:
      - mopl-batch/.env.dev
    volumes:
      - batch-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

# 데이터 영속성을 위한 Docker 볼륨 설정
volumes:
  kafka-data:
  user-db-data:
  user-slave-db-data:
  content-db-data:
  playlist-db-data:
  dm-db-data:
  dm-mongo-data:
  notification-db-data:
  image-db-data:
  batch-db-data:

networks:
  default:
    name: mopl-network
    external: true
