# -------------------------------------------------------------
# 로컬 테스트만을 위한 DB, Redis, RabbitMQ 구성임.
# -------------------------------------------------------------
services:
  # -------------------------------------------------------------
  # Nginx Service (API Gateway / Reverse Proxy) - SCG와 CloudFront로 대체
  # -------------------------------------------------------------
#  nginx:
#    image: nginx:1.25-alpine
#    container_name: mopl-nginx
#    ports:
#      - "80:80"
#      - "443:443"
#    volumes:
#      - ./nginx.conf.bak:/etc/nginx/nginx.conf.bak:ro
#      - ./html:/usr/share/nginx/html:ro
#    extra_hosts:
#      - "host.docker.internal:host-gateway"
#    restart: always
#    logging:
#      driver: "json-file"
#      options:
#        max-size: "10m"
#        max-file: "3"

  # -------------------------------------------------------------
  # Redis Services (각 마이크로서비스별 독립 인스턴스)
  # -------------------------------------------------------------
  user-redis:
    image: redis:7.2-alpine
    container_name: mopl-user-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_USER:-mopluserpwd123} --appendonly yes
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  watching-session-redis:
    image: redis:7.2-alpine
    container_name: mopl-watching-session-redis
    ports:
      - "6381:6379"
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  # -------------------------------------------------------------
  # RabbitMQ Service
  # -------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mopl-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # -------------------------------------------------------------
  # PostgreSQL Databases (Database-per-service 격리)
  # -------------------------------------------------------------
  user-db:
    image: postgres:18-alpine
    container_name: mopl-user-db
    ports:
      - "5432:5432"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    env_file:
      - mopl-user/.env.local
    volumes:
      - user-db-data:/var/lib/postgresql
      - ./mopl-user/docker/postgres/init-master.sh:/docker-entrypoint-initdb.d/init-master.sh:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-slave-db:
    image: postgres:18-alpine
    container_name: mopl-user-slave-db
    ports:
      - "5431:5432"
    env_file:
      - mopl-user/.env.local
    environment:
      - MASTER_HOST=user-db
    volumes:
      - user-slave-db-data:/var/lib/postgresql
      - ./mopl-user/docker/postgres/entrypoint-slave.sh:/entrypoint-slave.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-slave.sh"]
    depends_on:
      user-db:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  content-db:
    image: postgres:18-alpine
    container_name: mopl-content-db
    ports:
      - "5433:5432"
    env_file:
      - mopl-content/.env.local
    volumes:
      - content-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  playlist-db:
    image: postgres:18-alpine
    container_name: mopl-playlist-db
    ports:
      - "5434:5432"
    env_file:
      - mopl-playlist/.env.local
    volumes:
      - playlist-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-db:
    image: postgres:18-alpine
    container_name: mopl-dm-db
    ports:
      - "5435:5432"
    env_file:
      - mopl-dm/.env.local
    volumes:
      - dm-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  dm-mongo:
    image: mongo:7.0
    container_name: mopl-dm-mongo
    ports:
      - "27017:27017" # TODO 운영 환경에선 제거
    env_file:
      - mopl-dm/.env.local
    volumes:
      - dm-mongo-data:/data/db
    restart: always

  notification-db:
    image: postgres:18-alpine
    container_name: mopl-notification-db
    ports:
      - "5436:5432"
    env_file:
      - mopl-notification/.env.local
    volumes:
      - notification-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  image-db:
    image: postgres:18-alpine
    container_name: mopl-image-db
    ports:
      - "5437:5432"
    env_file:
      - mopl-image/.env.local
    volumes:
      - image-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

  batch-db:
    image: postgres:18-alpine
    container_name: mopl-batch-db
    ports:
      - "5438:5432"
    env_file:
      - mopl-batch/.env.local
    volumes:
      - batch-db-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

# 데이터 영속성을 위한 Docker 볼륨 설정
volumes:
  user-db-data:
  user-slave-db-data:
  content-db-data:
  playlist-db-data:
  dm-db-data:
  dm-mongo-data:
  notification-db-data:
  image-db-data:
  batch-db-data:
