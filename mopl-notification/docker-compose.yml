services:
  mopl-notification-app:
    container_name: mopl-notification-app
    build:
      context: ..
      dockerfile: mopl-notification/Dockerfile
    ports:
      - "8086:8086"
    env_file:
      - .env
    depends_on:
      mopl-notification-postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mopl-notification-postgres:
    image: postgres:18-alpine
    container_name: mopl-notification-postgres
    ports:
      - "5436:5432"
    env_file:
      - .env
    volumes:
      - mopl-notification-postgres-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mopl-notification-postgres-data:
