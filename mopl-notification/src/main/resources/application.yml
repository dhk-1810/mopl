server:
  port: 8086

spring:
  application:
    name: mopl-notification
  datasource:
    notification:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    notification:
      hibernate:
        ddl-auto: update
      open-in-view: false
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: false
        show-sql: false
  data:
    redis:
      cluster:
        nodes: ${SPRING_DATA_REDIS_CLUSTER_NODES:notification-redis-1:7001,notification-redis-2:7002,notification-redis-3:7003}
        max-redirects: 3
      password: ${SPRING_DATA_REDIS_PASSWORD:moplnotificationpwd123}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: notification-profile-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"

grpc:
  client:
    user-service:
      address: "static://${GRPC_USER_HOST:localhost}:${GRPC_USER_PORT:8181}"
      negotiation-type: plaintext
