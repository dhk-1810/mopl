server:
  port: 8085

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    notification:
      url: jdbc:postgresql://localhost:5432/${DB_NAME_NOTIFICATION}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver

  jpa:
    notification:
      hibernate:
        ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: false
