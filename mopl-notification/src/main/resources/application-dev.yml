server:
  port: 8086

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    notification:
      url: jdbc:postgresql://localhost:${DB_PORT}/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      driver-class-name: org.postgresql.Driver

  jpa:
    notification:
      hibernate:
        ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: false
