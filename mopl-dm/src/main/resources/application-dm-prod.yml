server:
  port: 8084

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    dm:
      url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME_DM}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    dm:
      hibernate:
        ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: false