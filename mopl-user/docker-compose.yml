services:
  mopl-user-app:
    container_name: mopl-user-app
    build:
      context: ..
      dockerfile: mopl-user/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      mopl-user-postgres:
        condition: service_healthy
      mopl-user-redis:
        condition: service_started
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mopl-user-postgres:
    image: postgres:18-alpine
    container_name: mopl-user-postgres
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - mopl-user-postgres-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mopl-user-redis:
    image: redis:7.2-alpine
    container_name: mopl-user-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD_USER:-mopluserpwd123} --appendonly yes
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mopl-user-postgres-data:
