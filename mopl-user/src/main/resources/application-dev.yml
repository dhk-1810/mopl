server:
  port: 8081

spring:
  config:
    activate:
      on-profile: dev
  # 데이터베이스 설정 (RDB)
  datasource:
    user:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
      username: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  jpa:
    user:
      hibernate:
        ddl-auto: update