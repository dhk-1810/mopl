server:
  port: 8081
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    user:
      master:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:5432}/${POSTGRES_DB}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
      slave:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${DB_SLAVE_HOST:localhost}:${DB_SLAVE_PORT:5431}/${POSTGRES_DB}
        username: ${POSTGRES_USER}
        password: ${POSTGRES_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"
          kakao:
            redirect-uri: "http://localhost:8080/login/oauth2/code/kakao"

mopl:
  oauth2:
    redirect-uri:
      success: "http://localhost:8080/oauth-redirect"
      failure: "http://localhost:8080/sign-in"

logging:
  level:
    root: INFO
    org.codeit.sb06.team03.mopl: DEBUG
    org.springframework.jdbc.datasource: DEBUG