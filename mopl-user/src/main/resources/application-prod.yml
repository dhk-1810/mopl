server:
  port: 8081

spring:
  config:
    activate:
      on-profile: prod
  # 데이터베이스 설정 (RDB)
  datasource:
    user:
      master:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME_USER}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
      slave:
        driver-class-name: org.postgresql.Driver
        url: jdbc:postgresql://${DB_READ_ENDPOINT:${DB_ENDPOINT}}:5432/${DB_NAME_USER}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
  jpa:
    user:
      hibernate:
        ddl-auto: validate
    open-in-view: false