services:
  mopl-content-app:
    container_name: mopl-content-app
    build:
      context: ..
      dockerfile: mopl-content/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      mopl-content-postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mopl-content-postgres:
    image: postgres:18-alpine
    container_name: mopl-content-postgres
    ports:
      - "5433:5432"
    env_file:
      - .env
    volumes:
      - mopl-content-postgres-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mopl-content-postgres-data:
