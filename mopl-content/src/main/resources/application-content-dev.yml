server:
  port: 8082

spring:
  datasource:
    content:
      url: jdbc:postgresql://localhost:5432/${DB_NAME_CONTENT}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    content:
      hibernate:
        ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true # 테이블 생성된 후 schema.sql 실행
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: false