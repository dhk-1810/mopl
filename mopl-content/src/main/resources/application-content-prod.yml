spring:
  datasource:
    content:
      url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME_CONTENT}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
  jpa:
    content:
      hibernate:
        ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: false
