services:
  mopl-image-app:
    container_name: mopl-image-app
    image: mopl-image:latest
    ports:
      - "8087:8087"
      - "8185:8185"
    env_file:
      - .env
    depends_on:
      mopl-image-postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mopl-image-postgres:
    image: postgres:18-alpine
    container_name: mopl-image-postgres
    command: postgres -p 5437
    ports:
      - "5437:5437"
    env_file:
      - .env
    volumes:
      - mopl-image-postgres-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5437 -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mopl-image-postgres-data:
    name: mopl-image-postgres-data
