spring:
  datasource:
    playlist:
      url: jdbc:postgresql://${DB_ENDPOINT_PLAYLIST}:5432/${DB_NAME_PLAYLIST}
      username: ${DB_USERNAME_PLAYLIST}
      password: ${DB_PASSWORD_PLAYLIST}
      driver-class-name: org.postgresql.Driver
  jpa:
    playlist:
      hibernate:
        ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
      show-sql: false