services:
  mopl-batch-app:
    container_name: mopl-batch-app
    build:
      context: ..
      dockerfile: mopl-batch/Dockerfile
    ports:
      - "8088:8088"
    env_file:
      - .env
    depends_on:
      mopl-batch-postgres:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  mopl-batch-postgres:
    image: postgres:18-alpine
    container_name: mopl-batch-postgres
    ports:
      - "5438:5432"
    env_file:
      - .env
    volumes:
      - mopl-batch-postgres-data:/var/lib/postgresql
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mopl-batch-postgres-data:
