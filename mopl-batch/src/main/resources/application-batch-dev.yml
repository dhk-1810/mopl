server:
  port: 8087

spring:
  config:
    activate:
      on-profile: dev
  datasource:
    batch:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://localhost:5432/${DB_NAME_BATCH}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: always
