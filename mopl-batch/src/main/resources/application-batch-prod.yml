server:
  port: 8087

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    batch:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${DB_ENDPOINT}:5432/${DB_NAME_BATCH}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
  batch:
    jdbc:
      initialize-schema: never # TODO DB Migration 사용