server:
  port: 8088

spring:
  application:
    name: mopl-batch
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  batch:
    jdbc:
      initialize-schema: always

mopl:
  api:
    tmdb:
      key: ${TMDB_API_KEY:mock}
      url: ${TMDB_API_URL:https://api.themoviedb.org/3}
    sportsdb:
      key: ${SPORTSDB_API_KEY:mock}
      url: ${SPORTSDB_API_URL:https://www.thesportsdb.com/api/v1/json}
  batch:
    cron: ${BATCH_CRON_SCHEDULE:0 0 3 * * ?}
  storage:
    aws:
      region: ${AWS_REGION:ap-northeast-2}
      bucket-name: ${AWS_S3_BUCKET}
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
      signature-duration-in-hours: 1 # Presigned URL 유효기간

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"

grpc:
  client:
    content-service:
      address: "static://${GRPC_CONTENT_HOST:localhost}:${GRPC_CONTENT_PORT:8182}"
      negotiation-type: plaintext

