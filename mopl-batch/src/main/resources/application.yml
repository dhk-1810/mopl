spring:
  application:
    name: mopl-batch
  batch:
    jdbc:
      initialize-schema: always
  flyway:
    enabled: true
    baseline-on-migrate: true
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

mopl:
  services:
    content:
      url: http://${CONTENT_HOST:localhost}:8082 # TODO .env파일에 추가 필요
  api:
    tmdb:
      key: ${TMDB_API_KEY:mock}
      url: ${TMDB_API_URL:https://api.themoviedb.org/3}
    sportsdb:
      key: ${SPORTSDB_API_KEY:mock}
      url: ${SPORTSDB_API_URL:https://www.thesportsdb.com/api/v1/json}
  batch:
    cron: ${BATCH_CRON_SCHEDULE:0 0 3 * * ?}
  storage:
    aws:
      region: ${AWS_REGION:ap-northeast-2}
      bucket-name: ${AWS_S3_BUCKET}
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
      signature-duration-in-hours: 1 # Presigned URL 유효기간

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
